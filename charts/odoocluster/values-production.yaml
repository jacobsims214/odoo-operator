# Production HA OdooCluster Example
# - 3x PostgreSQL nodes (HA cluster)
# - 3x Odoo replicas
# - Metabase for reporting dashboards
# - OCA web_responsive module for mobile-friendly UI
#
# Deploy with:
#   helm install my-company ./charts/odoocluster -n odoo-my-company --create-namespace -f examples/production-ha.yaml

# Cluster name
name: "simstech"

# =============================================================================
# Odoo Configuration
# =============================================================================
odoo:
  # Odoo 19 for latest features
  version: "19"
  
  # 3 replicas for high availability
  replicas: 3
  
  # Storage for Odoo filestore (shared across replicas via RWX or replicated)
  storage: "50Gi"
  # Use NFS storage for homelab
  storageClassName: "nfs-storage"
  
  # Resource limits for production workload
  resources:
    requests:
      cpu: "1"           # Request 1 CPU per replica
      memory: "4Gi"      # Request 4GB RAM per replica
    limits:
      cpu: "4"           # Limit to 4 CPUs per replica
      memory: "16Gi"     # Limit to 16GB RAM per replica
  
  # Public OCA modules
  addons:
    # OCA Web Responsive - Mobile-friendly UI
    # https://github.com/OCA/web/tree/19.0/web_responsive
    - name: "oca-web"
      repo: "https://github.com/OCA/web.git"
      branch: "19.0"
      path: "web_responsive"  # Only install web_responsive from this repo
    
    # GitHub Metrics Widget
    - name: "github_metrics_odoo_widget"
      repo: "https://github.com/jacobsims214/github_metrics_odoo_widget.git"
      branch: "main"
      path: "widget_github_stats"
    
    # Simstech Website Theme - Portfolio site with custom snippets & SEO
    # https://github.com/jacobsims214/simstech_webstie
    - name: "simstech_website"
      repo: "https://github.com/jacobsims214/simstech_webstie.git"
      branch: "main"
      path: "simstech_website"
    
    # OCA Session DB - Stores sessions in PostgreSQL for multi-replica support
    # REQUIRED for multi-replica Odoo - install after restore via Apps menu
    # https://github.com/OCA/server-tools/tree/19.0/session_db
    - name: "oca-server-tools"
      repo: "https://github.com/OCA/server-tools.git"
      branch: "19.0"
      path: "session_db"
      install: false  # Install manually after restore (new module)

# =============================================================================
# Database Configuration (CloudNative-PG)
# =============================================================================
database:
  # PostgreSQL 18 required - previous Odoo data was created with PG18
  # CloudNativePG supports PG18 images from ghcr.io/cloudnative-pg/postgresql:18
  postgresVersion: "18"
  
  # Storage for PostgreSQL data
  storage: "100Gi"
  # Use NFS storage for homelab
  storageClassName: "nfs-storage"
  
  # 3 instances for high availability (1 primary + 2 replicas)
  instances: 3
  
  # Resource limits for database nodes
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"
  
  # Backup disabled for homelab
  backup:
    enabled: false
  
  # Restore disabled - we'll restore manually from old NFS data
  restore:
    enabled: false

# =============================================================================
# Optional Add-ons
# =============================================================================
addons:
  # Valkey (Redis) for session caching - recommended for multi-replica Odoo
  valkey:
    enabled: true
    storage: "2Gi"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  
  # Metabase BI for reporting dashboards
  # NOTE: Metabase replicas not yet supported in operator (hardcoded to 1)
  # To enable multiple replicas, update the operator code
  bi:
    enabled: true
    tool: "metabase"
    storage: "10Gi"
    # Use NFS storage for homelab
    storageClassName: "nfs-storage"
    resources:
      requests:
        cpu: "1"         # Metabase needs decent CPU for report generation
        memory: "2Gi"    # 2GB minimum for smooth dashboard operation
      limits:
        cpu: "4"         # Allow burst for complex queries
        memory: "8Gi"    # Extra headroom for large datasets

# =============================================================================
# Networking
# =============================================================================
networking:
  # Disable AWS ALB Ingress - using Cloudflare Tunnel instead
  ingress:
    enabled: false
  
  # Tailscale - Private tailnet access (disabled)
  tailscale:
    authSecretName: "tailscale-auth"
    odoo:
      enabled: false
    bi:
      enabled: false
  
  # Cloudflare Tunnel - disabled, using Cilium LB + reverse proxy instead
  cloudflare:
    enabled: false
    tunnelSecretName: "cloudflare-tunnel"
    replicas: 1
    odoo:
      hostname: "www.simstech.cloud"
    bi:
      hostname: "data.simstech.cloud"

# =============================================================================
# Secrets
# =============================================================================
secrets:
  tailscale:
    create: false
  backup:
    create: false
  deployKeys: []
  # Cloudflare tunnel secret created via script (not managed by Helm):
  # ./scripts/create-cloudflare-tunnel-secret.sh simstech-odoo cloudflare-tunnel \
  #   "4d33f088-65c2-405e-a699-2224dceb5863" \
  #   ~/.cloudflared/4d33f088-65c2-405e-a699-2224dceb5863.json

# =============================================================================
# Extra Objects - ClusterIP services for Traefik routing
# =============================================================================
extraObjects:
  # Odoo internal service - Traefik routes www.simstech.cloud -> this service
  - apiVersion: v1
    kind: Service
    metadata:
      name: simstech-odoo-svc
      namespace: "{{ .Release.Namespace }}"
    spec:
      type: ClusterIP
      selector:
        odoo.simstech.cloud/cluster: simstech
        odoo.simstech.cloud/component: odoo
      ports:
        - name: http
          port: 80
          targetPort: 8069
        - name: longpolling
          port: 8072
          targetPort: 8072

  # Metabase internal service - Traefik routes data.simstech.cloud -> this service
  - apiVersion: v1
    kind: Service
    metadata:
      name: simstech-metabase-svc
      namespace: "{{ .Release.Namespace }}"
    spec:
      type: ClusterIP
      selector:
        odoo.simstech.cloud/cluster: simstech
        odoo.simstech.cloud/component: metabase
      ports:
        - name: http
          port: 80
          targetPort: 3000

